<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080706"><title>Share Card | CLASSIC SAN SEBASTIAN CLUB</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px;font-family:Poppins,sans-serif;color:#fff;background:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.88)),url('cafe-share-bg.jpg') center/cover fixed;display:grid;place-items:center}.wrap{width:min(440px,100%)}.top{display:flex;justify-content:flex-end}.lang{border:1px solid #d4af3750;background:#000a;color:#f2d778;border-radius:999px;padding:8px 13px;font-weight:800}.card{text-align:center;padding:30px 22px;border-radius:30px;background:#0d0b08c8;border:1px solid #d4af3760;backdrop-filter:blur(18px);box-shadow:0 24px 70px #0009}.brand{font-weight:900;font-size:24px;color:#e2c354}.avatar{width:126px;height:126px;object-fit:cover;border-radius:50%;border:4px solid #d4af37;margin:20px 0 10px}.name{font-size:26px;font-weight:800}.code{color:#e2c354;margin-top:5px}.rank{margin-top:12px;color:#ddd}.points{font-size:30px;font-weight:800;color:#e2c354;margin:15px 0}.club{font-size:13px;color:#ccc}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.btn{border:1px solid #d4af3750;border-radius:16px;padding:14px;background:#0c0b09d1;color:#fff;font:700 14px Poppins;cursor:pointer;text-decoration:none;text-align:center}.primary{background:linear-gradient(135deg,#efd36c,#b88b17);color:#080706}.back{display:block;text-align:center;color:#c8b66e;text-decoration:none;margin-top:14px;font-size:13px}</style></head><body><div class="wrap"><div class="top"><button id="langSwitch" class="lang" onclick="toggleLang()">DE</button></div><div class="card"><div class="brand">CLASSIC SAN<br>SEBASTIAN CLUB</div><img id="memberPhoto" class="avatar" src="logo.png"><div id="memberName" class="name">Member</div><div id="memberCode" class="code">—</div><div id="memberRank" class="rank">Bronze</div><div id="memberPoints" class="points">⭐ 0</div><div class="club">📍 Skalitzer Straße 97 · 10997 Berlin</div></div><div class="buttons"><button id="shareBtn" class="btn primary">↗ Share</button><a class="btn" href="https://www.google.com/maps/search/?api=1&query=Skalitzer%20Stra%C3%9Fe%2097%2C%2010997%20Berlin" target="_blank">📍 Maps</a></div><a class="back" href="dashboard.html">← <span data-i18n="back">Back to Dashboard</span></a></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script><script>async function load(){try{const m=await currentMember();if(!m)return;memberName.textContent=m.name||'Member';memberCode.textContent=m.member_code;memberRank.textContent=m.rank||'Bronze';memberPoints.textContent='⭐ '+(m.points??0)+' '+t('points');if(m.photo_url)memberPhoto.src=m.photo_url}catch(e){console.error(e)}}shareBtn.onclick=async()=>{const payload={title:'Classic San Sebastian Club',text:lang()==='de'?'Classic San Sebastian Club · Berlin':'Classic San Sebastian Club · Berlin',url:'https://azarqrcod.github.io/Classic-San-SebastianClub/'};try{if(navigator.share)await navigator.share(payload);else{await navigator.clipboard.writeText(payload.url);alert('Link copied')}}catch(e){if(e.name!=='AbortError')console.error(e)}};load();</script></body></html>
