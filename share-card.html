<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Share Card | Classic San Sebastian Club</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:22px;font-family:Poppins,sans-serif;color:#fff;background:linear-gradient(rgba(0,0,0,.48),rgba(0,0,0,.86)),url('cafe-share-bg.jpg') center/cover fixed;display:grid;place-items:center}.wrap{width:min(430px,100%)}.card{position:relative;text-align:center;padding:32px 24px;border-radius:30px;background:linear-gradient(145deg,rgba(18,16,12,.7),rgba(0,0,0,.55));border:1px solid rgba(212,175,55,.4);backdrop-filter:blur(16px);box-shadow:0 24px 70px rgba(0,0,0,.55),0 0 30px rgba(212,175,55,.1)}.brand{font-weight:800;font-size:25px;color:#e2c354;line-height:1.2}.avatar{width:126px;height:126px;object-fit:cover;border-radius:50%;border:4px solid #d4af37;margin:22px 0 12px;box-shadow:0 0 30px rgba(212,175,55,.25)}.name{font-size:27px;font-weight:800}.code{color:#e2c354;margin-top:5px}.rank{margin-top:13px;color:#ddd}.points{font-size:31px;font-weight:800;color:#e2c354;margin:16px 0}.club{font-size:13px;line-height:1.7;color:#ccc}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.btn{border:1px solid rgba(212,175,55,.3);border-radius:16px;padding:14px;background:rgba(12,11,9,.82);color:#fff;font:700 14px Poppins;cursor:pointer;text-decoration:none;text-align:center}.btn.primary{background:linear-gradient(135deg,#efd36c,#b88b17);color:#080706}.back{display:block;text-align:center;color:#c8b66e;text-decoration:none;margin-top:14px;font-size:13px}</style></head><body><div class="wrap"><div class="card" id="memberCard"><div class="brand">CLASSIC SAN<br>SEBASTIAN CLUB</div><img id="memberPhoto" class="avatar" src="logo.png" alt="Member"><div id="memberName" class="name">Member</div><div id="memberCode" class="code">AZ0000</div><div id="memberRank" class="rank">Bronze Member</div><div id="memberPoints" class="points">⭐ 0 Points</div><div class="club">📍 Skalitzer Straße 97 · 10997 Berlin</div></div><div class="buttons"><button class="btn primary" onclick="shareCard()">↗ Share Card</button><button class="btn" onclick="copyCard()">⧉ Copy Link</button></div><a class="back" href="dashboard.html">← Back to Dashboard</a></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const client=window.supabase.createClient('https://uzecfsxdngdtzwianhir.supabase.co','sb_publishable_FinqG9Dt2uZSQ-ZaoyALWA_qaSuaRpC');async function loadMember(){const code=localStorage.getItem('memberCode');if(!code){location.href='login.html';return}const {data,error}=await client.from('members').select('*').eq('member_code',code).single();if(error||!data){console.error(error);return}memberName.textContent=data.name||'Member';memberCode.textContent=data.member_code||code;memberRank.textContent=(data.rank||'Bronze')+' Member';memberPoints.textContent='⭐ '+(data.points??0)+' Points';if(data.photo_url)memberPhoto.src=data.photo_url}async function shareCard(){const payload={title:'Classic San Sebastian Club',text:'My Classic San Sebastian Club member card',url:location.href};try{if(navigator.share)await navigator.share(payload);else await copyCard()}catch(e){if(e.name!=='AbortError')console.error(e)}}async function copyCard(){try{await navigator.clipboard.writeText(location.href);alert('Card link copied.')}catch(e){prompt('Copy this link:',location.href)}}loadMember();</script></body></html>
