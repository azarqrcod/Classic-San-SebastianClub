<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080706"><title>Club Menu | CLASSIC SAN SEBASTIAN CLUB</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Poppins,sans-serif;background:linear-gradient(rgba(0,0,0,.46),rgba(0,0,0,.9)),url('berlin-bg.png') center/cover fixed;color:#fff;min-height:100vh;padding:24px 18px}.top{display:flex;justify-content:flex-end}.lang{border:1px solid #d4af3750;background:#000a;color:#f2d778;border-radius:999px;padding:8px 13px;font-weight:800}.logo{text-align:center;font-size:30px;font-weight:800;color:#f2d778;margin:8px 0 28px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;max-width:950px;margin:auto}.card{position:relative;height:250px;border-radius:24px;overflow:hidden;border:1px solid #d4af3740;text-decoration:none;color:#fff;box-shadow:0 18px 45px #0007}.card img{width:100%;height:100%;object-fit:cover;transition:.5s}.card:hover img{transform:scale(1.05)}.overlay{position:absolute;inset:0;background:linear-gradient(to top,#000e,#0002);display:flex;align-items:flex-end;padding:22px}.title{font-size:25px;font-weight:800;color:#f2d778}.sub{font-size:13px;color:#ddd;margin-top:5px}.back{display:block;width:max-content;margin:28px auto 0;color:#f2d778;text-decoration:none}@media(max-width:650px){.grid{grid-template-columns:1fr}.card{height:210px}}</style></head><body><div class="top"><button id="langSwitch" class="lang" onclick="toggleLang()">DE</button></div><div class="logo">CLASSIC SAN SEBASTIAN CLUB</div><div class="grid"><a class="card" href="cheesecake.html"><img src="images/cheesecake/main.jpg"><div class="overlay"><div><div class="title">🍰 Cheesecake</div><div id="s1" class="sub">Premium Selection</div></div></div></a><a class="card" href="hot-drinks.html"><img src="images/coffee/main.jpg"><div class="overlay"><div><div id="t2" class="title">☕ Hot Drinks</div><div id="s2" class="sub">Coffee & Tea</div></div></div></a><a class="card" href="cold-drinks.html"><img src="images/cold-drinks/main.png"><div class="overlay"><div><div id="t3" class="title">🧊 Cold Drinks</div><div id="s3" class="sub">Iced Coffee & Refreshments</div></div></div></a><a class="card" href="cocktails.html"><img src="images/cocktails/main.jpg"><div class="overlay"><div><div id="t4" class="title">🍹 Cocktails & Signature</div><div id="s4" class="sub">Special Drinks Collection</div></div></div></a></div><a class="back" href="dashboard.html">← <span data-i18n="back">Back to Dashboard</span></a><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script><script>function loc(){const de=lang()==='de';s1.textContent=de?'Premium-Auswahl':'Premium Selection';t2.textContent=de?'☕ Heißgetränke':'☕ Hot Drinks';s2.textContent=de?'Kaffee & Tee':'Coffee & Tea';t3.textContent=de?'🧊 Kalte Getränke':'🧊 Cold Drinks';s3.textContent=de?'Eiskaffee & Erfrischungen':'Iced Coffee & Refreshments';t4.textContent=de?'🍹 Cocktails & Signature':'🍹 Cocktails & Signature';s4.textContent=de?'Spezielle Getränkekarte':'Special Drinks Collection'}addEventListener('cssc-language-change',loc);loc();requireSession();</script></body></html>
