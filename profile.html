<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080706"><title>Profile | CLASSIC SAN SEBASTIAN CLUB</title><link rel="manifest" href="manifest.webmanifest"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--g:#d4af37;--g2:#f2d778;--line:rgba(212,175,55,.3)}*{box-sizing:border-box;margin:0;padding:0}body{font-family:Poppins,sans-serif;color:#fff;min-height:100vh;padding:18px;background:linear-gradient(rgba(0,0,0,.36),rgba(0,0,0,.88)),url('berlin-bg.png') center/cover fixed}.wrap{width:min(850px,100%);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.lang,.back{border:1px solid var(--line);background:#0008;color:var(--g2);border-radius:999px;padding:9px 14px;text-decoration:none;font-weight:800}.card{background:rgba(10,10,10,.72);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:26px;padding:24px;margin-bottom:15px;box-shadow:0 18px 55px #0007}.hero{text-align:center}.avatar{width:130px;height:130px;border-radius:50%;object-fit:cover;border:4px solid var(--g);box-shadow:0 0 30px #d4af3730}.name{font-size:29px;font-weight:800;color:var(--g2);margin-top:12px}.code{color:#bbb}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{text-align:center;background:#ffffff08;border-radius:16px;padding:16px}.stat strong{display:block;color:var(--g2);font-size:26px}.form{display:grid;gap:12px}.row label{display:block;color:var(--g2);font-size:12px;margin-bottom:5px}.row input{width:100%;padding:13px;border-radius:12px;border:1px solid #ffffff18;background:#ffffff0d;color:#fff}.readonly{padding:13px;background:#ffffff08;border-radius:12px}.btn{width:100%;padding:15px;border:0;border-radius:15px;background:linear-gradient(135deg,var(--g2),var(--g));font-weight:900}.status{text-align:center;min-height:22px;margin-top:10px;font-size:13px}@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="wrap"><div class="top"><a class="back" href="dashboard.html">← <span data-i18n="back">Back to Dashboard</span></a><button id="langSwitch" class="lang" onclick="toggleLang()">DE</button></div><section class="card hero"><img id="photo" class="avatar" src="logo.png"><div id="displayName" class="name">Member</div><div id="code" class="code">—</div></section><section class="card stats"><div class="stat"><strong id="points">0</strong><span data-i18n="points">Points</span></div><div class="stat"><strong id="visits">0</strong><span data-i18n="visits">Visits</span></div><div class="stat"><strong id="coupons">0</strong><span>Coupons</span></div><div class="stat"><strong id="rank">Bronze</strong><span data-i18n="rank">Rank</span></div></section><section class="card"><div class="form"><div class="row"><label data-i18n="profilePhoto">Profile photo (optional)</label><input id="photoInput" type="file" accept="image/*"></div><div class="row"><label data-i18n="fullName">Full name (optional)</label><input id="nameInput"></div><div class="row"><label data-i18n="email">Email</label><div id="email" class="readonly">—</div></div><div class="row"><label data-i18n="phone">Phone (optional)</label><input id="phoneInput"></div><div class="row"><label data-i18n="birthdayField">Birthday (optional)</label><input id="birthdayInput" type="date"></div><button id="saveBtn" class="btn" data-i18n="save">Save Changes</button><div id="status" class="status"></div></div></section></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script><script>let member=null,file=null;photoInput.onchange=e=>{file=e.target.files?.[0]||null;if(file)photo.src=URL.createObjectURL(file)};async function load(){try{member=await currentMember();if(!member)return;displayName.textContent=member.name||'Member';code.textContent=member.member_code;points.textContent=member.points??0;visits.textContent=member.visits??0;coupons.textContent=member.coupons??0;rank.textContent=member.rank||'Bronze';email.textContent=member.email||'—';nameInput.value=member.name||'';phoneInput.value=member.phone||'';birthdayInput.value=member.birthday||'';if(member.photo_url)photo.src=member.photo_url}catch(e){console.error(e)}}saveBtn.onclick=async()=>{saveBtn.disabled=true;status.textContent=lang()==='de'?'Speichern…':'Saving…';try{const patch={name:nameInput.value.trim()||null,phone:phoneInput.value.trim()||null,birthday:birthdayInput.value||null};if(file)patch.photo_url=await uploadAvatar(file);const {error}=await sb.from('members').update(patch);if(error)throw error;status.textContent=lang()==='de'?'Gespeichert.':'Saved.';await load()}catch(e){status.textContent=e.message||'Error'}saveBtn.disabled=false};load();</script></body></html>
