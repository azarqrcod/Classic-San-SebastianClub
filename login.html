<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080706"><title>Login | CLASSIC SAN SEBASTIAN CLUB</title><link rel="manifest" href="manifest.webmanifest"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--g:#d4af37;--g2:#f2d36f;--line:rgba(212,175,55,.3)}*{box-sizing:border-box;margin:0;padding:0}body{font-family:Poppins,sans-serif;min-height:100vh;color:#fff;padding:20px;background:linear-gradient(rgba(0,0,0,.42),rgba(0,0,0,.88)),url('berlin-bg.png') center/cover fixed;display:flex;align-items:center;justify-content:center}.card{width:min(470px,100%);background:rgba(10,10,10,.72);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:30px;padding:30px;box-shadow:0 28px 70px #0008}.top{display:flex;justify-content:flex-end}.lang{border:1px solid var(--line);background:#0007;color:var(--g2);border-radius:999px;padding:8px 13px;font-weight:800}.logo{width:110px;display:block;margin:0 auto 12px}h1{text-align:center;color:var(--g2);margin-bottom:20px}input{width:100%;padding:14px 15px;margin:8px 0;border-radius:13px;border:1px solid #ffffff18;background:#ffffff10;color:#fff}.btn{width:100%;padding:15px;border:0;border-radius:15px;background:linear-gradient(135deg,var(--g2),var(--g));font-weight:900;color:#090806;margin-top:10px}.link{text-align:center;color:var(--g2);margin-top:16px;cursor:pointer}.status{text-align:center;min-height:24px;margin-top:14px;font-size:13px}</style></head><body><div class="card"><div class="top"><button id="langSwitch" class="lang" onclick="toggleLang()">DE</button></div><img class="logo" src="logo.png"><h1 data-i18n="login">Member Login</h1><input id="email" type="email" autocomplete="email" data-i18n-placeholder="email" placeholder="Email"><input id="memberCode" autocomplete="current-password" data-i18n-placeholder="memberCode" placeholder="Member Code"><button id="loginBtn" class="btn" data-i18n="login">Member Login</button><div id="forgot" class="link" data-i18n="forgot">Forgot Member Code?</div><div id="status" class="status"></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script><script>async function doLogin(){loginBtn.disabled=true;status.textContent=lang()==='de'?'Anmeldung…':'Signing in…';const e=email.value.trim().toLowerCase(),c=memberCode.value.trim();try{let a=await sb.auth.signInWithPassword({email:e,password:c});if(a.error){await callPublic({action:'provision',email:e,memberCode:c});a=await sb.auth.signInWithPassword({email:e,password:c})}if(a.error)throw a.error;localStorage.setItem('memberCode',c);location.href='dashboard.html'}catch(err){console.error(err);status.textContent=lang()==='de'?'Mitglied nicht gefunden.':'Member not found.';loginBtn.disabled=false}}loginBtn.onclick=doLogin;memberCode.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});forgot.onclick=()=>{status.textContent=t('contactCafe')};(async()=>{const {data}=await sb.auth.getSession();if(data.session)location.replace('dashboard.html')})();</script></body></html>
