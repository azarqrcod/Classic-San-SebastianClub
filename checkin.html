<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check In | CLASSIC SAN SEBASTIAN CLUB</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;color:#fff;font-family:Poppins,sans-serif;background:linear-gradient(rgba(0,0,0,.48),rgba(0,0,0,.88)),url('berlin-bg.png') center/cover fixed}.card{width:min(92vw,620px);padding:38px;border:1px solid rgba(212,175,55,.35);border-radius:28px;background:rgba(8,8,8,.7);backdrop-filter:blur(16px);text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.45)}h1{color:#d4af37;font-size:28px;margin:0 0 22px}.status{font-size:19px;line-height:1.7}.success{color:#9be59b}.warning{color:#ffd080}.error{color:#ff9696}.btn{display:inline-block;margin-top:22px;padding:13px 22px;border-radius:14px;background:#d4af37;color:#080808;text-decoration:none;font-weight:800}
</style>
</head>
<body>
<div class="card"><h1>CLASSIC SAN SEBASTIAN CLUB</h1><div id="status" class="status">Checking member...</div><a class="btn" href="dashboard.html">Back to Dashboard</a></div>
<script>
const client=window.supabase.createClient('https://uzecfsxdngdtzwianhir.supabase.co','sb_publishable_FinqG9Dt2uZSQ-ZaoyALWA_qaSuaRpC');
const statusEl=document.getElementById('status');
function show(msg,cls=''){statusEl.className='status '+cls;statusEl.innerHTML=msg}
function berlinDay(date){return new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Berlin',year:'numeric',month:'2-digit',day:'2-digit'}).format(date)}
async function checkIn(){
try{
const memberCode=localStorage.getItem('memberCode');if(!memberCode){location.href='login.html';return}
const token=new URLSearchParams(location.search).get('token');if(!token){show('❌ Invalid QR','error');return}
const {data:tokenData,error:tokenError}=await client.from('checkin_tokens').select('*').eq('token',token).maybeSingle();
if(tokenError) throw tokenError;if(!tokenData){show('❌ Invalid QR','error');return}if(new Date(tokenData.expires_at)<new Date()){show('❌ QR Expired','error');return}
const {data,error}=await client.from('members').select('*').eq('member_code',memberCode).single();if(error||!data){show('❌ Member Not Found','error');return}
const now=new Date();
if(data.last_scan_at){const lastScan=new Date(data.last_scan_at);const diffHours=(now-lastScan)/3600000;if(diffHours<1){const mins=Math.max(1,Math.ceil(60-diffHours*60));show(`⏳ Check-In already used.<br>Please wait about ${mins} minute${mins===1?'':'s'}.`,'warning');return}}
let visits=Number(data.visits||0),points=Number(data.points||0),coupons=Number(data.coupons||0);let message='';
const firstVisitToday=!data.last_scan_at||berlinDay(new Date(data.last_scan_at))!==berlinDay(now);
if(firstVisitToday){visits+=1;points+=1;message='⭐ Daily Point Earned'}else{coupons+=1;message='🎁 Coupon Earned'}
if(coupons>=10){coupons-=10;points+=1;message+='<br><br>🏆 10 Coupons Converted To 1 Point'}
const {error:updateError}=await client.from('members').update({visits,points,coupons,last_scan_at:now.toISOString()}).eq('member_code',memberCode);if(updateError) throw updateError;
show(`✅ Check-In Successful<br><br>${message}<br><br>Visits: ${visits}<br>Points: ${points}<br>Coupons: ${coupons}`,'success');
}catch(err){console.error(err);show('❌ Check-In failed.<br>'+((err&&err.message)||'Please try again.'),'error')}
}
checkIn();
</script>
</body>
</html>
