<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080706"><title>Check In | CLASSIC SAN SEBASTIAN CLUB</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;color:#fff;font-family:Poppins,sans-serif;background:linear-gradient(rgba(0,0,0,.44),rgba(0,0,0,.9)),url('berlin-bg.png') center/cover fixed}.card{width:min(92vw,620px);padding:38px;border:1px solid rgba(212,175,55,.35);border-radius:28px;background:rgba(8,8,8,.74);backdrop-filter:blur(18px);text-align:center}.logo{width:100px}.status{font-size:19px;line-height:1.7;margin:18px 0}.success{color:#a9eeaa}.warning{color:#ffd080}.error{color:#ff9a9a}.btn{display:inline-block;padding:13px 22px;border-radius:14px;background:#d4af37;color:#080808;text-decoration:none;font-weight:800}.lang{position:fixed;top:18px;right:18px;border:1px solid #d4af3760;background:#0009;color:#f2d778;border-radius:999px;padding:8px 13px;font-weight:800}</style></head><body><button id="langSwitch" class="lang" onclick="toggleLang()">DE</button><div class="card"><img class="logo" src="logo.png"><h1>CLASSIC SAN SEBASTIAN CLUB</h1><div id="status" class="status">Checking…</div><a class="btn" href="dashboard.html" data-i18n="back">Back to Dashboard</a></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script><script>async function run(){try{await requireSession();const cafe=new URLSearchParams(location.search).get('cafe');if(!cafe){status.className='status error';status.textContent=lang()==='de'?'Ungültiger Café-QR-Code.':'Invalid café QR.';return}const r=await callSecure({action:'checkin',cafe});status.className='status success';status.innerHTML='✅ '+t('checkinSuccess')+'<br><br>'+t('visits')+': '+r.visits+'<br>'+t('points')+': '+r.points}catch(e){status.className='status '+(e.data?.already?'warning':'error');status.textContent=e.data?.already?t('alreadyChecked'):(e.message||'Check-in failed')}}run();</script></body></html>
