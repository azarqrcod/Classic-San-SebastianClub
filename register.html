<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080706"><title>Join | CLASSIC SAN SEBASTIAN CLUB</title><link rel="manifest" href="manifest.webmanifest"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--g:#d4af37;--g2:#f2d36f;--line:rgba(212,175,55,.3)}*{box-sizing:border-box;margin:0;padding:0}body{font-family:Poppins,sans-serif;min-height:100vh;color:#fff;padding:20px;background:linear-gradient(rgba(0,0,0,.4),rgba(0,0,0,.88)),url('berlin-bg.png') center/cover fixed;display:flex;align-items:center;justify-content:center}.card{width:min(560px,100%);background:rgba(10,10,10,.7);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:30px;padding:28px;box-shadow:0 28px 70px #0008}.top{display:flex;justify-content:flex-end}.lang{border:1px solid var(--line);background:#0007;color:var(--g2);border-radius:999px;padding:8px 13px;font-weight:800}.logo{width:110px;display:block;margin:0 auto 8px}h1{text-align:center;font-size:30px}.sub{text-align:center;color:var(--g2);margin:5px 0 22px}.avatar{width:126px;height:126px;border-radius:50%;overflow:hidden;border:3px solid var(--g);margin:auto}.avatar img{width:100%;height:100%;object-fit:cover}label{display:block;color:var(--g2);font-size:13px;margin-top:14px}input{width:100%;padding:14px 15px;margin-top:7px;border-radius:13px;border:1px solid #ffffff18;background:#ffffff10;color:#fff;outline:none}.consent{display:flex;gap:10px;margin-top:18px;color:#ccc;font-size:12px;line-height:1.55}.consent input{width:auto;margin-top:3px}.btn{width:100%;padding:16px;border:0;border-radius:16px;margin-top:19px;background:linear-gradient(135deg,var(--g2),var(--g));font-weight:900;color:#090806}.btn:disabled{opacity:.55}.status{text-align:center;min-height:22px;margin-top:12px;font-size:13px}.login{text-align:center;margin-top:16px}.login a{color:var(--g2)}</style></head><body><div class="card"><div class="top"><button id="langSwitch" class="lang" onclick="toggleLang()">DE</button></div><img src="logo.png" class="logo"><h1 data-i18n="join">Join The Club</h1><div class="sub">CLASSIC SAN SEBASTIAN CLUB</div><form id="form"><div class="avatar"><img id="preview" src="logo.png"></div><label data-i18n="profilePhoto">Profile photo (optional)</label><input id="photo" type="file" accept="image/*"><label data-i18n="fullName">Full name (optional)</label><input id="name" maxlength="80"><label data-i18n="email">Email</label><input id="email" type="email" required autocomplete="email"><label data-i18n="phone">Phone (optional)</label><input id="phone" maxlength="40"><label data-i18n="birthdayField">Birthday (optional)</label><input id="birthday" type="date"><div class="consent"><input id="consent" type="checkbox" required><span data-i18n="consent">I agree that the information entered here is used to operate my club membership and rewards account.</span></div><button id="submit" class="btn" data-i18n="createCard">Create Member Card</button><div id="status" class="status"></div></form><div class="login"><span data-i18n="alreadyMember">Already a member?</span> <a href="login.html" data-i18n="login">Member Login</a></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script><script>let file=null;photo.onchange=e=>{file=e.target.files?.[0]||null;if(file)preview.src=URL.createObjectURL(file)};form.onsubmit=async e=>{e.preventDefault();submit.disabled=true;status.textContent=lang()==='de'?'Mitgliedskarte wird erstellt…':'Creating your member card…';try{const email=document.getElementById('email').value.trim().toLowerCase();const payload={action:'register',email,name:name.value.trim(),phone:phone.value.trim(),birthday:birthday.value||null};const r=await callPublic(payload);localStorage.setItem('memberCode',r.memberCode);const auth=await sb.auth.signInWithPassword({email,password:r.memberCode});if(auth.error)throw auth.error;if(file){const photoUrl=await uploadAvatar(file);const u=await sb.from('members').update({photo_url:photoUrl});if(u.error)throw u.error}status.textContent=lang()==='de'?'Fertig. Installation wird geöffnet…':'Done. Opening installation…';setTimeout(()=>location.href='install.html',350)}catch(err){console.error(err);status.textContent=err.message||'Registration failed';submit.disabled=false}};if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});</script></body></html>
