<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join The Club | CLASSIC SAN SEBASTIAN CLUB</title>
<link rel="manifest" href="manifest.webmanifest">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
:root{--gold:#d4af37;--gold2:#f2d36f;--glass:rgba(10,10,10,.58)}
body{min-height:100vh;color:#fff;padding:28px;background:linear-gradient(rgba(0,0,0,.42),rgba(0,0,0,.86)),url('berlin-bg.png') center/cover fixed;display:flex;align-items:center;justify-content:center}
.card{width:100%;max-width:560px;background:var(--glass);backdrop-filter:blur(18px);border:1px solid rgba(212,175,55,.32);border-radius:32px;padding:32px;box-shadow:0 28px 70px rgba(0,0,0,.5),0 0 45px rgba(212,175,55,.08)}
.logo{width:118px;display:block;margin:0 auto 10px;filter:drop-shadow(0 0 18px rgba(212,175,55,.22))}
h1{text-align:center;font-size:34px;font-weight:800}.subtitle{text-align:center;color:var(--gold2);margin:6px 0 26px}.avatarBox{width:138px;height:138px;border-radius:50%;overflow:hidden;margin:auto;border:3px solid var(--gold);box-shadow:0 0 24px rgba(212,175,55,.2)}.avatarBox img{width:100%;height:100%;object-fit:cover}
label{display:block;margin-top:15px;color:var(--gold2);font-size:13px;font-weight:600}
input{width:100%;padding:15px 16px;margin-top:8px;border:1px solid rgba(212,175,55,.14);border-radius:14px;background:rgba(255,255,255,.07);color:#fff;outline:none}input:focus{border-color:rgba(212,175,55,.55);box-shadow:0 0 0 3px rgba(212,175,55,.08)}input[type=file]{padding:12px}
.consent{display:flex;gap:10px;align-items:flex-start;margin-top:18px;color:#ccc;font-size:12px;line-height:1.55}.consent input{width:auto;margin-top:3px}.registerBtn{width:100%;padding:16px;margin-top:20px;border:none;border-radius:16px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#090909;font-size:17px;font-weight:800;cursor:pointer;box-shadow:0 12px 30px rgba(212,175,55,.18)}.registerBtn:disabled{opacity:.55;cursor:not-allowed}
#status{margin-top:14px;text-align:center;font-size:14px;min-height:22px}.error{color:#ff8a8a}.success{color:#9be59b}.login{text-align:center;margin-top:18px}.login a{color:var(--gold2);text-decoration:none}
@media(max-width:600px){body{padding:16px}.card{padding:24px 18px;border-radius:26px}h1{font-size:28px}}
</style>
</head>
<body>
<div class="card">
<img src="logo.png" class="logo" alt="Classic San Sebastian Club">
<h1>JOIN THE CLUB</h1>
<p class="subtitle">CLASSIC SAN SEBASTIAN CLUB</p>
<form id="memberForm">
<div class="avatarBox"><img id="preview" src="logo.png" alt="Member preview"></div>
<label for="photo">Profile photo (optional)</label>
<input type="file" id="photo" accept="image/*">
<label for="name">Full name</label>
<input type="text" id="name" placeholder="Full Name" required maxlength="80">
<label for="email">Email</label>
<input type="email" id="email" placeholder="Email Address" required maxlength="120" autocomplete="email">
<label for="phone">Phone (optional)</label>
<input type="text" id="phone" placeholder="Phone" maxlength="40">
<label for="birthday">🎂 Birthday</label>
<input type="date" id="birthday" required>
<div class="consent"><input type="checkbox" id="consent" required><span>I agree that the information entered here is used to operate my club membership and rewards account.</span></div>
<button id="submitBtn" type="submit" class="registerBtn">CREATE MEMBER CARD</button>
<div id="status"></div>
</form>
<div class="login">Already a member? <a href="login.html">Login</a></div>
</div>
<script>
const SUPABASE_URL='https://uzecfsxdngdtzwianhir.supabase.co';
const SUPABASE_KEY='sb_publishable_FinqG9Dt2uZSQ-ZaoyALWA_qaSuaRpC';
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const form=document.getElementById('memberForm');
const photoInput=document.getElementById('photo');
const preview=document.getElementById('preview');
const submitBtn=document.getElementById('submitBtn');
const statusEl=document.getElementById('status');
let selectedFile=null;
photoInput.addEventListener('change',e=>{selectedFile=e.target.files?.[0]||null;if(selectedFile) preview.src=URL.createObjectURL(selectedFile)});
function setStatus(message,type=''){statusEl.className=type;statusEl.textContent=message}
function safeName(name){return name.replace(/[^a-zA-Z0-9._-]/g,'_').slice(-80)}
async function uniqueMemberCode(){for(let i=0;i<8;i++){const code='az'+Math.floor(1000+Math.random()*9000);const {data,error}=await client.from('members').select('member_code').eq('member_code',code).maybeSingle();if(error) throw error;if(!data) return code}throw new Error('Could not generate a unique member code. Please try again.')}
form.addEventListener('submit',async e=>{
e.preventDefault();submitBtn.disabled=true;setStatus('Creating your member card...');
try{
const name=document.getElementById('name').value.trim();
const email=document.getElementById('email').value.trim().toLowerCase();
const phone=document.getElementById('phone').value.trim();
const birthday=document.getElementById('birthday').value;
if(!name||!email||!birthday) throw new Error('Please complete all required fields.');
const {data:existing,error:existingError}=await client.from('members').select('member_code').eq('email',email).maybeSingle();
if(existingError) throw existingError;
if(existing){throw new Error('This email is already registered. Please use Login instead.');}
const memberCode=await uniqueMemberCode();
let photoUrl='';
if(selectedFile){
if(selectedFile.size>5*1024*1024) throw new Error('Profile photo must be smaller than 5 MB.');
const ext=(selectedFile.name.split('.').pop()||'jpg').toLowerCase();
const fileName=`${memberCode}-${Date.now()}.${safeName(ext)}`;
const {error:uploadError}=await client.storage.from('avatars').upload(fileName,selectedFile,{upsert:false,contentType:selectedFile.type||undefined});
if(uploadError) throw uploadError;
const {data:publicData}=client.storage.from('avatars').getPublicUrl(fileName);
photoUrl=publicData?.publicUrl||'';
}
const {error:insertError}=await client.from('members').insert([{name,email,phone,birthday,photo_url:photoUrl,member_code:memberCode,points:0,visits:0,receipt_count:0,rank:'Bronze'}]);
if(insertError) throw insertError;
localStorage.setItem('memberCode',memberCode);localStorage.setItem('memberName',name);if(photoUrl)localStorage.setItem('memberPhoto',photoUrl);
setStatus('Member created successfully. Opening dashboard...','success');
setTimeout(()=>{window.location.href='dashboard.html'},500);
}catch(err){console.error(err);setStatus(err?.message||'Registration failed. Please try again.','error');submitBtn.disabled=false;}
});
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
</body>
</html>
