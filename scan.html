<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scan QR | CLASSIC SAN SEBASTIAN CLUB</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px;color:#fff;font-family:Poppins,sans-serif;background:linear-gradient(rgba(0,0,0,.52),rgba(0,0,0,.9)),url('berlin-bg.png') center/cover fixed;display:flex;justify-content:center;align-items:center}.card{width:min(94vw,640px);padding:28px;border-radius:28px;background:rgba(8,8,8,.72);backdrop-filter:blur(16px);border:1px solid rgba(212,175,55,.32);box-shadow:0 24px 60px rgba(0,0,0,.48);text-align:center}.logo{width:90px}.gold{color:#d4af37}#reader{margin-top:20px;border-radius:18px;overflow:hidden;background:#111}.btn{display:inline-block;margin-top:18px;padding:13px 20px;border:0;border-radius:14px;background:#d4af37;color:#080808;font-weight:800;text-decoration:none;cursor:pointer}.muted{margin-top:12px;color:#aaa;font-size:13px;line-height:1.5}#status{margin-top:14px;min-height:24px}
</style>
</head>
<body>
<div class="card">
<img src="logo.png" class="logo" alt="Logo">
<h1 class="gold">📷 Café QR Check-In</h1>
<div id="reader"></div>
<div id="status">Point your camera at the café QR code.</div>
<a class="btn" href="dashboard.html">Back to Dashboard</a>
<div class="muted">Camera access is required only while scanning the café QR.</div>
</div>
<script>
const statusEl=document.getElementById('status');
function handleResult(text){
try{
const url=new URL(text,location.href);
if(url.hostname==='azarqrcod.github.io'&&url.pathname.includes('/Classic-San-SebastianClub/checkin.html')&&url.searchParams.get('token')){statusEl.textContent='QR found. Opening check-in...';location.href=url.href;return}
}catch(e){}
statusEl.textContent='This is not a valid CLASSIC SAN SEBASTIAN CLUB QR code.';
}
const scanner=new Html5QrcodeScanner('reader',{fps:10,qrbox:{width:250,height:250},rememberLastUsedCamera:true,supportedScanTypes:[Html5QrcodeScanType.SCAN_TYPE_CAMERA,Html5QrcodeScanType.SCAN_TYPE_FILE]},false);
scanner.render((decodedText)=>{scanner.clear().catch(()=>{});handleResult(decodedText)},()=>{});
</script>
</body>
</html>
