<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080706"><title>Scan QR | CLASSIC SAN SEBASTIAN CLUB</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet"><script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px;color:#fff;font-family:Poppins,sans-serif;background:linear-gradient(rgba(0,0,0,.48),rgba(0,0,0,.9)),url('berlin-bg.png') center/cover fixed;display:flex;justify-content:center;align-items:center}.card{width:min(94vw,640px);padding:28px;border-radius:28px;background:rgba(8,8,8,.75);backdrop-filter:blur(18px);border:1px solid rgba(212,175,55,.32);text-align:center}.logo{width:90px}.gold{color:#f2d778}#reader{margin-top:20px;border-radius:18px;overflow:hidden;background:#111}.btn,.lang{display:inline-block;margin-top:18px;padding:12px 18px;border:1px solid rgba(212,175,55,.35);border-radius:14px;background:#d4af37;color:#080808;font-weight:800;text-decoration:none}.lang{position:fixed;top:12px;right:16px;margin:0;background:#000b;color:#f2d778}.muted{margin-top:12px;color:#aaa;font-size:13px}#status{margin-top:14px;min-height:24px}</style></head><body><button id="langSwitch" class="lang" onclick="toggleLang()">DE</button><div class="card"><img src="logo.png" class="logo"><h1 class="gold">📷 <span data-i18n="scan">Scan Café QR</span></h1><div id="reader"></div><div id="status" data-i18n="scanHint">Scan the QR code displayed inside the café.</div><a class="btn" href="dashboard.html" data-i18n="back">Back to Dashboard</a><div class="muted">Camera access is used only while scanning.</div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script><script>function handleResult(text){try{const u=new URL(text,location.href);if(u.hostname==='azarqrcod.github.io'&&u.pathname.endsWith('/Classic-San-SebastianClub/checkin.html')&&u.searchParams.get('cafe')==='skalitzer97'){status.textContent=lang()==='de'?'QR erkannt. Check-in wird geöffnet…':'QR found. Opening check-in…';location.href=u.href;return}}catch{}status.textContent=lang()==='de'?'Ungültiger Club-QR-Code.':'Invalid club QR code.'}requireSession().then(s=>{if(!s)return;const scanner=new Html5QrcodeScanner('reader',{fps:10,qrbox:{width:250,height:250},rememberLastUsedCamera:true,supportedScanTypes:[Html5QrcodeScanType.SCAN_TYPE_CAMERA,Html5QrcodeScanType.SCAN_TYPE_FILE]},false);scanner.render(txt=>{scanner.clear().catch(()=>{});handleResult(txt)},()=>{})});</script></body></html>
