<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080706"><title>Rewards | CLASSIC SAN SEBASTIAN CLUB</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:18px;display:grid;place-items:center;background:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.9)),url('berlin-bg.png') center/cover fixed;color:#fff;font-family:Poppins,sans-serif}.card{width:min(620px,100%);padding:30px;border-radius:28px;background:#080808c7;border:1px solid #d4af3750;backdrop-filter:blur(18px);text-align:center}.lang{position:fixed;top:16px;right:16px;border:1px solid #d4af3750;background:#000b;color:#f2d778;border-radius:999px;padding:8px 13px;font-weight:800}h1,.points{color:#f2d778}.points{font-size:50px;font-weight:900;margin:18px 0}.bar{height:12px;background:#ffffff12;border-radius:999px;overflow:hidden}.fill{height:100%;background:#d4af37;width:0}.message{margin:20px 0;line-height:1.7}.btn{padding:14px 20px;border:0;border-radius:14px;background:#d4af37;color:#080808;font-weight:900;margin:7px}.secondary{background:#ffffff10;color:#fff;border:1px solid #d4af3740}.note{font-size:12px;color:#aaa}.back{display:inline-block;margin-top:18px;color:#f2d778;text-decoration:none}</style></head><body><button id="langSwitch" class="lang" onclick="toggleLang()">DE</button><div class="card"><h1>🎁 <span data-i18n="rewards">Rewards</span></h1><div id="points" class="points">—</div><div class="bar"><div id="fill" class="fill"></div></div><div id="message" class="message">Loading…</div><button id="claim" class="btn" hidden data-i18n="claim">Claim Reward</button><div id="staff" hidden><input id="pin" type="password" inputmode="numeric" placeholder="Staff PIN" style="padding:12px;border-radius:12px;border:1px solid #d4af3740;background:#ffffff10;color:#fff"><button id="confirm" class="btn" data-i18n="staffConfirm">Staff Confirmation</button><div class="note" data-i18n="staffOnly">Staff only</div></div><a class="back" href="dashboard.html">← <span data-i18n="back">Back to Dashboard</span></a></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script><script>let p=0;async function load(){try{const m=await currentMember();if(!m)return;p=m.points||0;points.textContent='⭐ '+p;fill.style.width=Math.min(100,p*10)+'%';if(p<10){message.textContent=(10-p)+' '+t('rewardProgress');claim.hidden=true}else{message.textContent=t('eligible');claim.hidden=false}}catch(e){message.textContent=e.message}}claim.onclick=()=>{claim.hidden=true;staff.hidden=false;message.textContent=lang()==='de'?'Bitte einem Mitarbeiter zeigen.':'Please show this screen to a staff member.'};confirm.onclick=async()=>{try{const r=await callSecure({action:'redeem10',staffPin:pin.value});message.textContent=lang()==='de'?'Prämie bestätigt. Danke!':'Reward confirmed. Thank you!';staff.hidden=true;p=r.points;points.textContent='⭐ '+p;fill.style.width=Math.min(100,p*10)+'%'}catch(e){message.textContent=e.message==='Wrong staff PIN'?t('wrongPin'):e.message}};load();</script></body></html>
