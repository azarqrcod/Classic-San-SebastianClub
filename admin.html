<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080706"><title>Staff Console | CLASSIC SAN SEBASTIAN CLUB</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:18px;background:#050505;color:#fff;font-family:Poppins,sans-serif}.wrap{width:min(1000px,100%);margin:auto}.top{display:flex;justify-content:space-between;align-items:center}.lang,.back{border:1px solid #d4af3750;background:#111;color:#f2d778;border-radius:999px;padding:9px 14px;text-decoration:none;font-weight:800}.gate,.panel,.card{background:#101010;border:1px solid #d4af3740;border-radius:22px;padding:22px;margin-top:15px}.gate{text-align:center}.gate input,.panel input,.panel textarea{width:100%;padding:13px;border-radius:12px;border:1px solid #d4af3730;background:#080808;color:#fff;margin-top:10px}.btn{padding:13px 18px;border:0;border-radius:12px;background:#d4af37;color:#080808;font-weight:900;margin-top:10px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}.card{text-align:center;margin-top:0}.num{font-size:32px;color:#f2d778;font-weight:900}.hidden{display:none}.result{line-height:1.8;margin-top:14px;color:#ddd}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="wrap"><div class="top"><a class="back" href="dashboard.html">← Dashboard</a><button id="langSwitch" class="lang" onclick="toggleLang()">DE</button></div><div id="gate" class="gate"><h2>🔒 Staff Console</h2><p id="gateText">Authorized staff only.</p><input id="staffPin" type="password" inputmode="numeric" placeholder="Staff PIN"><button id="unlock" class="btn">Unlock</button><div id="gateStatus"></div></div><div id="app" class="hidden"><div class="grid"><div class="card"><div id="members" class="num">0</div><div>Members</div></div><div class="card"><div id="checkins" class="num">0</div><div>Check-ins</div></div><div class="card"><div id="points" class="num">0</div><div>Points</div></div><div class="card"><div id="coupons" class="num">0</div><div>Coupons</div></div></div><div class="panel"><h3>🔎 Member Lookup</h3><input id="query" placeholder="Email / Member Code / Phone"><button id="search" class="btn">Search</button><div id="result" class="result"></div></div><div class="panel"><h3>☕ Daily Note</h3><textarea id="note" rows="5" maxlength="500"></textarea><button id="saveNote" class="btn">Save Daily Note</button><div id="noteStatus"></div></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script><script>let pin='';async function summary(){const r=await callSecure({action:'admin_summary',staffPin:pin});members.textContent=r.members;checkins.textContent=r.checkins;points.textContent=r.points;coupons.textContent=r.coupons}unlock.onclick=async()=>{pin=staffPin.value.trim();try{await requireSession();await summary();gate.classList.add('hidden');app.classList.remove('hidden')}catch(e){gateStatus.textContent=e.message||'Access denied'}};search.onclick=async()=>{try{const r=await callSecure({action:'admin_search',staffPin:pin,query:query.value.trim()});const m=r.member;if(!m){result.textContent='Member not found';return}result.innerHTML='<b>'+((m.name)||'Member')+'</b><br>'+m.member_code+'<br>'+((m.email)||'—')+'<br>'+((m.phone)||'—')+'<br>Points: '+(m.points||0)+' · Visits: '+(m.visits||0)}catch(e){result.textContent=e.message}};saveNote.onclick=async()=>{try{await callSecure({action:'admin_save_note',staffPin:pin,message:note.value});noteStatus.textContent='Saved'}catch(e){noteStatus.textContent=e.message}};requireSession();</script></body></html>
